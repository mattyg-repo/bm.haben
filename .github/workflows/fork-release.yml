name: Fork-Release

# Nur bewusst veröffentlichte Releases dieses Forks. Ein Push auf main veröffentlicht nichts.
# Das Manifest erscheint erst nach grünen Prüfungen und dem vollständigen Image-Build.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  vorbereiten:
    if: github.repository == 'mattyg-repo/bm.haben' && startsWith(github.event.release.tag_name, 'bm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release prüfen
        env:
          FORK_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$FORK_TAG" =~ ^bm-v[0-9]+\.[0-9]+\.[0-9]+\.[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          test "$(gh release view "$FORK_TAG" --json assets --jq '[.assets[] | select(.name == "haben-image.json")] | length')" = 0
          python3 -m unittest discover -s deploy/fork -p 'test_*.py'
          sh -n deploy/fork/install.sh

  checks:
    needs: vorbereiten
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  veroeffentlichen:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mattyg-repo/bm.haben:${{ github.event.release.tag_name }}
          build-args: HABEN_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mattyg-repo/bm.haben
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
      - name: Geprüftes Image zum Release hinzufügen
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          FORK_TAG: ${{ github.event.release.tag_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          digest = os.environ["IMAGE_DIGEST"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
          manifest = {"schema": 1, "repository": os.environ["GH_REPO"], "tag": os.environ["FORK_TAG"],
                      "commit": os.environ["SOURCE_COMMIT"], "image": "ghcr.io/mattyg-repo/bm.haben@" + digest}
          with open("haben-image.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          gh release upload "$FORK_TAG" haben-image.json
